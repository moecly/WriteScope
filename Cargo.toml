[package]
name = "writescope"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Measure filesystem write amplification using Linux block-device counters"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
humantime = "2"
libc = "0.2"
parse-size = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
