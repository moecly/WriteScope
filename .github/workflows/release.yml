name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: linux-x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "writescope") | .version')
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="v$version"
          else
            tag="$REF_NAME"
          fi
          if [[ "$tag" != "v$version" ]]; then
            echo "tag '$tag' does not match Cargo.toml version '$version'" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Prepare executable
        run: |
          mkdir -p dist
          strip target/x86_64-unknown-linux-musl/release/writescope
          cp target/x86_64-unknown-linux-musl/release/writescope dist/writescope-linux-x86_64
          file dist/writescope-linux-x86_64
          ./dist/writescope-linux-x86_64 --version
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          args=(--title "$TAG" --generate-notes)
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            args+=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" dist/writescope-linux-x86_64 "${args[@]}"
